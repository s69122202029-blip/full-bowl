<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Full bowl pet store</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Itim&family=Noto+Sans+Thai:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff;--ink:#1f2a29;--mut:#5d6b69;--or:#ff7a1a;--ordk:#c75600;--mint:#e4f3ee;--sun:#fff0c9;--line:#d5e2de;--card:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121a19;--ink:#eef5f3;--mut:#a3b4b0;--mint:#1b2b28;--sun:#33290f;--line:#2f4440;--card:#1a2523;--ordk:#ff9a4d}}
:root[data-theme="dark"]{--bg:#121a19;--ink:#eef5f3;--mut:#a3b4b0;--mint:#1b2b28;--sun:#33290f;--line:#2f4440;--card:#1a2523;--ordk:#ff9a4d}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:400 16px/1.65 "Noto Sans Thai",system-ui,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
h1,h2,h3,.logo{font-family:Itim,"Noto Sans Thai",sans-serif;font-weight:400;line-height:1.25;margin:0}
a{color:inherit}
button{font:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--or);outline-offset:2px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--bg);border-bottom:2px solid var(--line)}
.bar{max-width:1100px;margin:auto;padding:10px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.logo{font-size:30px;text-decoration:none}.logo small{color:var(--or);font-size:20px;margin-left:3px}
nav{display:flex;align-items:center;gap:6px}
nav a{padding:6px 10px;border-radius:99px;text-decoration:none;font-weight:600;font-size:15px}
nav a.on{background:var(--ink);color:var(--bg)}
nav a.cartb{position:relative;display:inline-flex;padding:6px 8px}
.cartb svg{width:28px;height:28px}
.cartb span{position:absolute;top:-2px;right:-2px;background:var(--or);color:#1f2a29;font-size:12px;font-weight:600;min-width:20px;height:20px;border-radius:10px;display:grid;place-items:center}
main{max-width:1100px;margin:auto;padding:20px 16px 40px;min-height:70vh}

.hero h1{font-size:clamp(34px,6vw,58px)}
.hero p{max-width:46ch;color:var(--mut);margin:12px 0 22px}
.pile{font-size:clamp(70px,14vw,130px);text-align:center;line-height:1.1}
.btn{display:inline-block;border:0;background:var(--or);color:#1f2a29;font-weight:600;padding:12px 24px;border-radius:99px;text-decoration:none}
.btn.alt{background:transparent;border:2px solid var(--ink);color:var(--ink)}
.btn:hover{background:var(--ordk);color:#fff}
.txt{max-width:70ch;margin:36px auto;text-align:center}
.txt h2{font-size:28px;margin-bottom:8px}.txt p{color:var(--mut);margin:0}
.banner{border-radius:28px;background:var(--mint);padding:34px;text-align:center;font-family:Itim,sans-serif;font-size:clamp(22px,4vw,34px)}
.banner small{display:block;font:400 15px "Noto Sans Thai",sans-serif;color:var(--mut);margin-top:6px}
.sec{margin-top:48px}.sec>h2{font-size:30px;text-align:center;margin-bottom:18px}
.sec>h2.l{text-align:left;font-size:24px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.row-s{display:flex;gap:14px;overflow-x:auto;padding-bottom:10px;scroll-snap-type:x proximity}
.row-s .card{flex:0 0 190px;scroll-snap-align:start}
.card{background:var(--card);border:2px solid var(--line);border-radius:18px;overflow:hidden;display:flex;flex-direction:column}
.ph{aspect-ratio:1;display:grid;place-items:center;font-size:64px;position:relative;background:hsl(var(--h) 70% 90%)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .ph{background:hsl(var(--h) 25% 22%)}}
.ph i{position:absolute;top:8px;left:8px;background:var(--or);color:#1f2a29;font:600 12px/1 "Noto Sans Thai";padding:5px 8px;border-radius:99px}
.cb{padding:10px 12px 12px;display:flex;flex-direction:column;gap:6px;flex:1}
.cb h4{margin:0;font-size:14px;font-weight:600;line-height:1.4;flex:1}
.cb .r{display:flex;align-items:center;justify-content:space-between}
.cb s{color:var(--mut);font-size:13px;margin-right:6px}
.add{border:0;background:var(--ink);color:var(--bg);width:38px;height:38px;border-radius:12px;display:grid;place-items:center}
.add:hover{background:var(--or);color:#1f2a29}.add svg{width:20px;height:20px}
.types{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.type{border:0;border-radius:24px;padding:36px 10px;font-family:Itim,sans-serif;font-size:24px;color:#1f2a29;display:flex;flex-direction:column;align-items:center;gap:6px}
.type span{font-size:72px;line-height:1.1}
.type:hover{transform:translateY(-3px)}
.split{display:grid;grid-template-columns:1fr 1fr;gap:24px;align-items:center}
.slide{border-radius:24px;aspect-ratio:4/3;display:grid;place-items:center;font-size:90px;text-align:center}
.slide small{display:block;font:600 16px "Noto Sans Thai";margin-top:-10px}
.dots{display:flex;justify-content:center;gap:8px;margin-top:12px}
.dots button{width:14px;height:14px;border-radius:50%;border:0;background:var(--line);padding:0}
.dots button.on{background:var(--or);width:30px;border-radius:8px}
.certs{display:flex;gap:14px;overflow-x:auto;padding-bottom:10px}
.cert{flex:0 0 150px;aspect-ratio:3/4;border:2px solid var(--line);border-radius:16px;display:grid;place-items:center;text-align:center;font-size:48px;background:var(--card)}
.cert small{display:block;font:600 13px/1.3 "Noto Sans Thai";padding:0 8px}
.info{display:grid;gap:16px}.info>div{display:flex;gap:14px;align-items:center}
.ic{flex:0 0 46px;height:46px;border-radius:50%;border:2px solid var(--ink);display:grid;place-items:center;font-size:20px}
.info b{display:block}.info span:not(.ic){color:var(--mut);font-size:14px}
form.box{max-width:560px;margin:auto;border:2px solid var(--line);border-radius:22px;padding:24px;background:var(--card)}
label{display:block;font-weight:600;margin:12px 0 4px;font-size:14px}
input,textarea{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:2px solid var(--ink);border-radius:14px;padding:10px 14px}
input[type=radio]{width:auto}
.err{color:#c0392b;font-size:13px;min-height:18px;margin:2px 0 0}
.ok{background:var(--mint);border-radius:14px;padding:12px 16px;margin-top:14px;font-weight:600}
.social a{display:flex;gap:10px;align-items:center;text-decoration:none;padding:6px 0}
.map{border:2px solid var(--line);border-radius:24px;min-height:200px;display:grid;place-items:center;text-align:center;background:repeating-linear-gradient(45deg,var(--mint) 0 14px,var(--bg) 14px 28px);padding:16px}
.empty{text-align:center;border:2px dashed var(--line);border-radius:28px;padding:44px 16px}
.empty svg{width:96px;height:96px}
.svc{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:36px}
.svc div{border:2px solid var(--line);border-radius:18px;padding:18px 12px;text-align:center;font-size:14px;color:var(--mut)}
.svc b{display:block;color:var(--ink);font-size:15px}.svc span{font-size:38px;display:block}
.cl{display:grid;grid-template-columns:1fr 340px;gap:24px;align-items:start}
.item{display:grid;grid-template-columns:64px 1fr auto;gap:12px;align-items:center;padding:12px 0;border-bottom:2px solid var(--line)}
.item .ph{font-size:34px;border-radius:14px}
.qty{display:inline-flex;align-items:center;gap:8px;margin-top:4px}
.qty button{width:30px;height:30px;border-radius:50%;border:2px solid var(--ink);background:none;color:var(--ink)}
.sum{border:2px solid var(--line);border-radius:22px;padding:20px;background:var(--card)}
.sum .t{display:flex;justify-content:space-between;gap:10px;padding:4px 0}
.sum .tt{font-weight:600;font-size:20px;border-top:2px solid var(--line);margin-top:8px;padding-top:10px}
.prog{height:10px;background:var(--line);border-radius:6px;overflow:hidden;margin:6px 0 12px}.prog i{display:block;height:100%;background:var(--or)}
.pay{display:flex;gap:10px;align-items:center;border:2px solid var(--line);border-radius:14px;padding:10px 14px;margin-top:8px;font-weight:400}
.steps{display:flex;gap:8px;justify-content:center;margin-bottom:20px;font-size:14px;color:var(--mut)}
.steps b{color:var(--ink)}
footer{background:var(--ink);color:var(--bg);padding:32px 16px;margin-top:30px}
.fi{max-width:1100px;margin:auto;display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;font-size:14px}
footer a{margin-right:12px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,30px);background:var(--ink);color:var(--bg);padding:10px 20px;border-radius:99px;opacity:0;transition:.25s;z-index:20;pointer-events:none;font-weight:600}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:820px){.hero,.split,.cl{grid-template-columns:1fr}.grid{grid-template-columns:repeat(2,1fr)}.svc{grid-template-columns:repeat(2,1fr)}.types{grid-template-columns:1fr}.type{flex-direction:row;padding:18px;justify-content:center}.type span{font-size:48px}.hero{padding:28px 20px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>

<div class="info"><h2>ข้อมูลติดต่อ</h2><div><span class="ic">📞</span><p style="margin:0"><b>เบอร์โทรศัพท์</b><span>013-982-XXXX</span></p></div><div><span class="ic">✉️</span><p style="margin:0"><b>อีเมล</b><span>hello@fullbowl.com</span></p></div><div><span class="ic">💬</span><p style="margin:0"><b>แอดไลน์</b><span>@fullbowl.com</span></p></div><div><span class="ic">📍</span><p style="margin:0"><b>ที่ตั้งร้าน</b><span>123 ถนนตัวอย่าง กรุงเทพฯ (แก้เป็นที่อยู่จริง)</span></p></div><div><span class="ic">🕙</span><p style="margin:0"><b>เวลาทำการ</b><span>จันทร์–ศุกร์ 10.00–21.00 น.<br>เสาร์–อาทิตย์ 10.00–23.00 น.</span></p></div></div></div>
<section class="sec"><form class="box" id="cf" novalidate><h2 style="font-size:26px">ส่งข้อความถึงเรา</h2><label for="cn">ชื่อ-นามสกุล</label><input id="cn" placeholder="กรอกชื่อ - นามสกุล" autocomplete="name"><p class="err" data-e="cn"></p><label for="cp">เบอร์โทรศัพท์</label><input id="cp" inputmode="tel" placeholder="กรอกเบอร์โทรศัพท์" autocomplete="tel"><p class="err" data-e="cp"></p><label for="cm">ข้อความสอบถาม</label><textarea id="cm" rows="4" placeholder="พิมพ์ข้อความของคุณที่นี่.."></textarea><p class="err" data-e="cm"></p><button class="btn" type="submit">ส่งข้อความ</button><div id="cok"></div></form></section>
<div class="split sec" style="align-items:start"><div class="social"><h2 style="font-size:24px;margin-bottom:8px">ติดตามเราได้ที่</h2><a href="#contact">📸 Instagram: @fullbowl</a><a href="#contact">📘 Facebook: Full bowl pet store</a><a href="#contact">🎵 TikTok: @fullbowl</a></div><div><h2 style="font-size:24px;margin-bottom:8px">แผนที่ร้าน full bowl</h2><div class="map">📍 ใส่แผนที่ร้านที่นี่</div></div></div>`,
cart:()=>{const ids=Object.keys(cart);if(!ids.length)return`<div class="empty"><svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M6 24h52l-6 28a4 4 0 0 1-4 3H16a4 4 0 0 1-4-3zM20 24l8-14M44 24l-8-14M24 32v14M32 32v14M40 32v14"/></svg><p>ตะกร้าสินค้าของคุณว่างเปล่า</p><a class="btn" href="#products">เริ่มช้อปปิ้ง</a></div>${svc}`;
const s=sub(),left=Math.max(0,1000-s);return`<h1 style="font-size:32px;margin-bottom:16px">ตะกร้าสินค้า</h1><div class="cl"><div>${ids.map(id=>{const p=get(id);return`<div class="item"><div class="ph" style="--h:${HUE[p.c]}">${p.e}</div><div><b>${p.n}</b><br>${money(price(p))}<div class="qty"><button data-q="${id}:-1" aria-label="ลดจำนวน">−</button><span>${cart[id]}</span><button data-q="${id}:1" aria-label="เพิ่มจำนวน">+</button></div></div><div style="text-align:right"><b>${money(price(p)*cart[id])}</b><br><button class="btn alt" style="padding:4px 12px;font-size:13px;margin-top:6px" data-q="${id}:del">ลบ</button></div></div>`}).join("")}</div>
<aside class="sum"><div class="t"><span>ยอดสินค้า</span><b>${money(s)}</b></div><div class="prog"><i style="width:${Math.min(100,s/10)}%"></i></div><p style="font-size:14px;margin:0 0 8px;color:var(--mut)">${left?`ซื้อเพิ่มอีก ${money(left)} ส่งฟรี`:"ได้รับสิทธิ์ส่งฟรีแล้ว 🎉"}</p><a class="btn" style="display:block;text-align:center" href="#checkout">ไปหน้าชำระเงิน</a></aside></div>${svc}`},
checkout:()=>`<div class="steps"><span>ตะกร้า</span>›<b>ชำระเงิน</b>›<span>เสร็จสิ้น</span></div><h1 style="font-size:32px;margin-bottom:16px">ชำระเงิน</h1><div class="cl"><form class="box" style="margin:0;max-width:none" id="ck" novalidate>
<h3 style="font-size:22px">ข้อมูลผู้สั่งซื้อ</h3><label for="kn">ชื่อ-นามสกุล</label><input id="kn" autocomplete="name"><p class="err" data-e="kn"></p><label for="kp">เบอร์โทรศัพท์</label><input id="kp" inputmode="tel" autocomplete="tel"><p class="err" data-e="kp"></p>
<h3 style="font-size:22px;margin-top:16px">การรับสินค้า</h3><label class="pay"><input type="radio" name="dl" value="ship" checked> จัดส่งถึงบ้าน (ส่งฟรีเมื่อครบ 1,000 บาท ไม่ถึงคิด ฿50)</label><label class="pay"><input type="radio" name="dl" value="pick"> รับที่ร้าน (ฟรี)</label>
<div id="ad"><label for="ka">ที่อยู่จัดส่ง</label><textarea id="ka" rows="3" autocomplete="street-address"></textarea><p class="err" data-e="ka"></p></div>
<h3 style="font-size:22px;margin-top:16px">วิธีชำระเงิน</h3><label class="pay"><input type="radio" name="pm" value="พร้อมเพย์" checked> พร้อมเพย์ QR</label><label class="pay"><input type="radio" name="pm" value="บัตร"> บัตรเครดิต/เดบิต</label><label class="pay"><input type="radio" name="pm" value="COD"> เก็บเงินปลายทาง</label>
<button class="btn" style="margin-top:20px;width:100%" type="submit">ยืนยันการสั่งซื้อ</button></form>
<aside class="sum"><h3 style="font-size:20px;margin-bottom:8px">สรุปคำสั่งซื้อ</h3>${Object.entries(cart).map(([id,q])=>`<div class="t" style="font-size:14px"><span>${get(id).e} ${get(id).n} ×${q}</span><span>${money(price(get(id))*q)}</span></div>`).join("")}<div class="t"><span>ค่าจัดส่ง</span><span id="sh"></span></div><div class="t tt"><span>รวมทั้งหมด</span><span id="tot"></span></div></aside></div>`,
done:()=>`<div class="empty"><div style="font-size:70px">🎉</div><h1 style="font-size:30px">สั่งซื้อสำเร็จ</h1><p>หมายเลขคำสั่งซื้อ <b>${lastOrder}</b><br>ขอบคุณที่เลือก Full bowl ทีมงานจะติดต่อยืนยันทางโทรศัพท์</p><a class="btn" href="#home">กลับหน้าแรก</a></div>`
};
function route(){let h=(location.hash||"#home").slice(1);if(!pages[h])h="home";
if(h==="done"&&!lastOrder)h="home";
if(h==="checkout"&&!Object.keys(cart).length){location.hash="cart";return}
app.innerHTML=pages[h]();document.querySelectorAll("nav a").forEach(a=>a.classList.toggle("on",a.dataset.n===h));
if(!pendingScroll)window.scrollTo(0,0);
if(h==="about")initSlides();if(h==="contact")initContact();if(h==="checkout")initCheckout();
if(pendingScroll){const el=$("#cat-"+pendingScroll);pendingScroll=null;el&&el.scrollIntoView()}}
function initSlides(){const S=[["🐶","สุนัขของเรา","hsl(35 80% 86%)"],["🐱","แมวของเรา","hsl(200 70% 87%)"],["🐰","ทุกชีวิตตัวเล็ก","hsl(140 55% 84%)"]];let i=0;const el=$("#sl"),d=$("#dt");
const show=n=>{i=n;el.style.background=S[n][2];el.style.color="#1f2a29";el.innerHTML=`<div>${S[n][0]}<small>${S[n][1]}</small></div>`;d.innerHTML=S.map((_,k)=>`<button class="${k===n?"on":""}" data-s="${k}" aria-label="สไลด์ ${k+1}"></button>`).join("")};
show(0);d.onclick=e=>{const b=e.target.closest("[data-s]");b&&show(+b.dataset.s)};
const t=setInterval(()=>{if(!document.body.contains(el)){clearInterval(t);return}show((i+1)%3)},4500)}
const chk=(id,fn,m)=>{const bad=!fn($("#"+id).value.trim());document.querySelector(`[data-e=${id}]`).textContent=bad?m:"";return!bad};
const phone=x=>/^0\d{8,9}$/.test(x.replace(/[-\s]/g,""));
function initContact(){$("#cf").onsubmit=e=>{e.preventDefault();const r=[chk("cn",x=>x.length>1,"กรอกชื่อ-นามสกุล"),chk("cp",phone,"กรอกเบอร์โทรศัพท์ 9–10 หลัก เช่น 0812345678"),chk("cm",x=>x.length>4,"พิมพ์ข้อความที่ต้องการสอบถาม")];
if(r.every(Boolean)){$("#cok").innerHTML='<div class="ok">ส่งข้อความแล้ว ทีมงานจะติดต่อกลับภายใน 1 วันทำการ</div>';e.target.reset()}}}
function initCheckout(){const f=$("#ck"),s=sub();const calc=()=>{const pick=f.dl.value==="pick",ship=pick||s>=1000?0:50;$("#ad").style.display=pick?"none":"block";$("#sh").textContent=ship?money(ship):"ฟรี";$("#tot").textContent=money(s+ship)};
f.addEventListener("change",calc);calc();
f.onsubmit=e=>{e.preventDefault();const pick=f.dl.value==="pick";const r=[chk("kn",x=>x.length>1,"กรอกชื่อ-นามสกุล"),chk("kp",phone,"กรอกเบอร์โทรศัพท์ 9–10 หลัก")];if(!pick)r.push(chk("ka",x=>x.length>9,"กรอกที่อยู่จัดส่งให้ครบ"));
if(!r.every(Boolean))return;lastOrder="FB-"+Date.now().toString().slice(-6);cart={};save();location.hash="done"}}
document.addEventListener("click",e=>{const a=e.target.closest("[data-add]");if(a){const id=a.dataset.add;cart[id]=(cart[id]||0)+1;save();toast("เพิ่มลงตะกร้าแล้ว");return}
const q=e.target.closest("[data-q]");if(q){const[id,d]=q.dataset.q.split(":");if(d==="del")delete cart[id];else{cart[id]+=+d;if(cart[id]<1)delete cart[id]}save();route();return}
const g=e.target.closest("[data-go]");if(g){const[pg,c]=g.dataset.go.split(":");pendingScroll=c;if(location.hash==="#"+pg)route();else location.hash=pg}});
addEventListener("hashchange",route);save();route();
</script>
</body>
